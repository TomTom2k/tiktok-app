<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px/1.6 system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;color:#2a1d16;background:#fffaf3}h1{font-size:1.6em}code,textarea{font:14px ui-monospace,monospace}textarea{width:100%;height:90px}</style><title>Authorized</title></head><body>
<h1>TikTok authorization</h1>
<p id="msg">Copy the full URL below and paste it into <code>./tiktok.py auth</code>.</p>
<textarea id="u" readonly></textarea>
<p><button id="c">Copy</button></p>
<p>The code is single-use and expires shortly; it is useless without the app's client secret.</p>
<script>
const u=document.getElementById('u');u.value=location.href;
const p=new URLSearchParams(location.search);
if(p.get('error'))document.getElementById('msg').textContent='TikTok returned an error: '+p.get('error')+' — '+(p.get('error_description')||'');
document.getElementById('c').onclick=()=>{u.select();navigator.clipboard.writeText(u.value)};
</script>
</body></html>
